      <path d="M332 124.4 L 323 140"/>
      <path d="M387.6 180 L 372 189"/>
      <path d="M408 256 H 390"/>
      <path d="M387.6 332 L 372 323"/>
      <path d="M332 387.6 L 323 372"/>
