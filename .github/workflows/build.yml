name: build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # Lets release.yml gate a publish on exactly these checks.
  workflow_call:

jobs:
  # Verified criteria (updated 2026-05-05) require support for the currently
  # supported LTS releases of Node.js, which are v22 and v24.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test # lint + build + smoke tests

  homebridge-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save homebridge@^1.8.0
      - run: npm run build
      - run: node test/smoke.mjs

  # Catches the case where `files` in package.json drifts and the published
  # tarball is missing dist/ or config.schema.json.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert required files are packed
        run: |
          npm pack --json > /tmp/pack.json
          for f in dist/index.js config.schema.json LICENSE README.md CHANGELOG.md; do
            grep -q "\"$f\"" /tmp/pack.json || { echo "missing from tarball: $f"; exit 1; }
          done
