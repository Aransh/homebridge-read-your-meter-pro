name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The plugin itself supports Node 20 (Homebridge 1.8+ runs there), so the
  # published code has to compile and lint cleanly on it.
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The smoke test loads Homebridge 2 to get the real PlatformAccessory and HAP
  # classes, and Homebridge 2 requires Node >= 22 — so the harness cannot run on
  # Node 20 even though the plugin can.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Catches the case where `files` in package.json drifts and the published
  # tarball is missing dist/ or config.schema.json.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: Assert required files are packed
        run: |
          npm pack --json > /tmp/pack.json
          for f in dist/index.js config.schema.json LICENSE README.md; do
            grep -q "\"$f\"" /tmp/pack.json || { echo "missing from tarball: $f"; exit 1; }
          done
