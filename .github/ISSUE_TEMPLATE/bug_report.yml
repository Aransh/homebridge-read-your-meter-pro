name: Bug report
description: Something the plugin does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Before filing: a sensor showing "no reading yet" or an old date is usually
        the portal's publication lag rather than a bug — see
        [Behaviour worth knowing](https://github.com/Aransh/homebridge-read-your-meter-pro#behaviour-worth-knowing).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From the Homebridge UI, or `npm ls -g homebridge-read-your-meter-pro`.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: homebridge-version
    attributes:
      label: Homebridge version
      placeholder: "2.4.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: "`node --version`"
      placeholder: v22.22.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Raspberry Pi OS 12 / Docker / macOS 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Homebridge log
      description: >-
        Turn on debug mode in the Homebridge UI (Settings → Homebridge Debug
        Mode), restart, and wait for one poll. The plugin never logs your
        password or session token, but please still check before pasting.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your platform config
      description: >-
        The `ReadYourMeterPro` block from `config.json`, **with `email` and
        `password` removed**.
      render: json
    validations:
      required: false
